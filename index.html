<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tora MOD Wiki</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  /* テーマ基本色 */
  --bg: #0d0e13;
  --header: #151720;
  --card: #1b202d;
  --card-sub: #12151e;
  --border: #303547;
  --text: #f2f3f7;
  --sub: #9ba2b2;
  --hover: #252c3c;

  /* ★各陣営の文字色 */
  --c-impostor: #ff4d4d; /* インポスター：赤 */
  --c-madmate:  #ff4d4d; /* マッドメイト：赤 */
  --c-crewmate: #38bdf8; /* クルーメイト：青（水色） */
  --c-neutral:  #9ca3af; /* 第三陣営：灰色 */
  --c-modifier: #22c55e; /* 属性：緑 */
  --c-ghost:    #ffffff; /* 幽霊役職：白 */
}

body.light {
  --bg: #f3f4f7;
  --header: #ffffff;
  --card: #ffffff;
  --card-sub: #edf0f6;
  --border: #d9dce5;
  --text: #222532;
  --sub: #697080;
  --hover: #f7f8fb;
  --c-ghost: #4b5563; /* ライトモード時のみ白は見えなくなるため濃いグレー */
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", sans-serif;
  transition: background .2s, color .2s;
}

/* ヘッダー */
header {
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: var(--header);
  border-bottom: 1px solid var(--border);
  font-size: 22px;
  font-weight: bold;
}

.settings-button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background .2s;
}
.settings-button:hover {
  background: var(--hover);
}

/* メイン */
main {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  font-size: 34px;
  margin: 0 0 6px 0;
}

.subtitle {
  color: var(--sub);
  font-size: 15px;
}

/* ウェルカムカード */
.welcome {
  margin-top: 28px;
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.welcome h2 {
  margin-top: 0;
  margin-bottom: 14px;
  font-size: 22px;
}

.welcome p {
  margin: 0;
  color: var(--sub);
  line-height: 1.8;
  font-size: 15px;
}

/* 役職一覧 */
.section-title {
  font-size: 26px;
  margin-top: 40px;
  margin-bottom: 18px;
}

.role-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 14px;
}

/* 役職カード本体 */
.role-category {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 16px 20px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--text);
  text-decoration: none;
  transition: background .2s, transform .15s, border-color .2s;
}

.role-category:hover {
  background: var(--hover);
  transform: translateY(-2px);
  border-color: #4a526d;
}

/* アイコン枠 */
.category-icon {
  width: 52px;
  height: 52px;
  background: var(--card-sub);
  border: 1px solid var(--border);
  border-radius: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
}

/* テキストエリア */
.category-info {
  display: flex;
  flex-direction: column;
  gap: 4px;
  overflow: hidden;
}

.category-name {
  font-size: 18px;
  font-weight: bold;
  line-height: 1.3;
}

.category-desc {
  font-size: 13px;
  color: var(--sub);
  line-height: 1.2;
}

.arrow {
  margin-left: auto;
  color: var(--sub);
  font-size: 22px;
  padding-left: 8px;
}

/* ★★★ 文字色の指定（確実に色が変わるように !important を付与） ★★★ */
.role-category.impostor .category-name {
  color: var(--c-impostor) !important;
}
.role-category.madmate .category-name {
  color: var(--c-madmate) !important;
}
.role-category.crewmate .category-name {
  color: var(--c-crewmate) !important;
}
.role-category.neutral .category-name {
  color: var(--c-neutral) !important;
}
.role-category.modifier .category-name {
  color: var(--c-modifier) !important;
}
.role-category.ghost .category-name {
  color: var(--c-ghost) !important;
}

/* フッター */
footer {
  margin-top: 70px;
  padding: 30px;
  text-align: center;
  color: var(--sub);
  border-top: 1px solid var(--border);
  font-size: 13px;
}

/* 設定モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(2px);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 100;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 400px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.close {
  background: none;
  border: none;
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

/* スマホ対応 */
@media (max-width: 600px) {
  .role-grid {
    grid-template-columns: 1fr;
  }
  h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<header>
  <span>Tora MOD</span>
  <button class="settings-button" onclick="openSettings()">設定</button>
</header>

<main>
  <h1>Tora MOD</h1>
  <div class="subtitle">Tora MOD Official Wiki</div>

  <!-- ウェルカム -->
  <section class="welcome">
    <h2>Welcome to Tora MOD Wiki</h2>
    <p>
      Tora MODに関する情報をまとめたWikiです。<br>
      役職・システム・設定などの情報を掲載していきます。
    </p>
  </section>

  <!-- 役職一覧 -->
  <h2 class="section-title">役職一覧</h2>

  <div class="role-grid">

    <!-- インポスター（赤） -->
    <a class="role-category impostor" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">インポスター</span>
        <span class="category-desc">インポスター陣営の役職</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- マッドメイト（赤） -->
    <a class="role-category madmate" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">マッドメイト</span>
        <span class="category-desc">クルーだがインポスターを支援</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- クルーメイト（青） -->
    <a class="role-category crewmate" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">クルーメイト</span>
        <span class="category-desc">船のタスクと追放を目指す陣営</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- 第三陣営（灰色） -->
    <a class="role-category neutral" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">第三陣営</span>
        <span class="category-desc">独自勝利を目指す陣営</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- 属性（緑） -->
    <a class="role-category modifier" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">属性</span>
        <span class="category-desc">役職に追加で付与される能力</span>
      </div>
      <span class="arrow">›</span>
    </a>

    <!-- 幽霊役職（白） -->
    <a class="role-category ghost" href="#">
      <div class="category-icon"></div>
      <div class="category-info">
        <span class="category-name">幽霊役職</span>
        <span class="category-desc">死亡後に発動する役職</span>
      </div>
      <span class="arrow">›</span>
    </a>

  </div>
</main>

<footer>
  Tora MOD Wiki
</footer>

<!-- 設定モーダル -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>設定</h2>
      <button class="close" onclick="closeSettings()">×</button>
    </div>
    <div class="setting-row">
      <span>テーマ</span>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark">ダークモード</option>
        <option value="light">ライトモード</option>
      </select>
    </div>
  </div>
</div>

<script>
const savedTheme = localStorage.getItem("tora-theme") || "dark";

function applyTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("themeSelect").value = theme;
}

function changeTheme(theme) {
  localStorage.setItem("tora-theme", theme);
  applyTheme(theme);
}

function openSettings() {
  document.getElementById("settingsModal").classList.add("show");
}

function closeSettings() {
  document.getElementById("settingsModal").classList.remove("show");
}

applyTheme(savedTheme);

document.getElementById("settingsModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeSettings();
  }
});
</script>

</body>
</html>
