
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tora MOD Wiki</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  --bg: #0d0e13;
  --header: #151720;
  --card: #1b202d;
  --border: #303547;
  --text: #f2f3f7;
  --sub: #9ba2b2;
}

body.light {
  --bg: #f3f4f7;
  --header: #ffffff;
  --card: #ffffff;
  --border: #d9dce5;
  --text: #222532;
  --sub: #697080;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", sans-serif;
  transition: background .2s, color .2s;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 22px;
  background: var(--header);
  border-bottom: 1px solid var(--border);
  font-size: 23px;
  font-weight: bold;
}

.settings-button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 9px 13px;
  font-size: 15px;
  cursor: pointer;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  color: var(--sub);
  font-size: 15px;
}

.welcome {
  margin-top: 35px;
  padding: 25px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 15px;
}

.welcome h2 {
  margin-top: 0;
  font-size: 22px;
}

.welcome p {
  color: var(--sub);
  line-height: 1.8;
}

footer {
  margin-top: 70px;
  padding: 25px;
  text-align: center;
  color: var(--sub);
  border-top: 1px solid var(--border);
  font-size: 13px;
}

/* 設定画面 */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: #0009;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 10;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 400px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 22px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
}

.close {
  background: none;
  border: none;
  color: var(--text);
  font-size: 25px;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 10px;
  border-radius: 8px;
}
</style>
</head>

<body>

<header>
  <span>Tora MOD</span>
  <button class="settings-button" onclick="openSettings()">
    ⚙ 設定
  </button>
</header>

<main>

  <h1>Tora MOD</h1>

  <div class="subtitle">
    Tora MOD Official Wiki
  </div>

  <section class="welcome">
    <h2>Welcome to Tora MOD Wiki</h2>
    <p>
      Tora MODに関する情報をまとめたWikiです。
      <br>
      役職・システム・設定などの情報を掲載していきます。
    </p>
  </section>

</main>

<footer>
  Tora MOD Wiki
</footer>

<!-- 設定画面 -->
<div class="modal" id="settingsModal">
  <div class="modal-content">

    <div class="modal-header">
      <h2>設定</h2>
      <button class="close" onclick="closeSettings()">×</button>
    </div>

    <div class="setting-row">
      <span>テーマ</span>

      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark">ダークモード</option>
        <option value="light">ライトモード</option>
      </select>
    </div>

  </div>
</div>

<script>

// 保存されたテーマを読み込む
const savedTheme = localStorage.getItem("tora-theme") || "dark";

function applyTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("themeSelect").value = theme;
}

function changeTheme(theme) {
  localStorage.setItem("tora-theme", theme);
  applyTheme(theme);
}

function openSettings() {
  document.getElementById("settingsModal").classList.add("show");
}

function closeSettings() {
  document.getElementById("settingsModal").classList.remove("show");
}

// 初期設定
applyTheme(savedTheme);

// 背景をタップして閉じる
document.getElementById("settingsModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeSettings();
  }
});

</script>

</body>
</html>
