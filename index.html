
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tora MOD Wiki</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0e13;
  color: #f2f3f7;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  height: 65px;
  display: flex;
  align-items: center;
  padding: 0 22px;
  background: #151720;
  border-bottom: 1px solid #30333d;
  font-size: 23px;
  font-weight: bold;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 35px 20px;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.subtitle {
  color: #9ba2b2;
  font-size: 15px;
}

.welcome {
  margin-top: 35px;
  padding: 25px;
  background: #1b202d;
  border: 1px solid #303547;
  border-radius: 15px;
}

.welcome h2 {
  margin-top: 0;
  font-size: 22px;
}

.welcome p {
  color: #c4c9d4;
  line-height: 1.8;
}

footer {
  margin-top: 70px;
  padding: 25px;
  text-align: center;
  color: #777e8d;
  border-top: 1px solid #30333d;
  font-size: 13px;
}
</style>
</head>

<body>

<header>
  Tora MOD
</header>

<main>

  <h1>Tora MOD</h1>

  <div class="subtitle">
    Tora MOD Official Wiki
  </div>

  <section class="welcome">
    <h2>Welcome to Tora MOD Wiki</h2>
    <p>
      Tora MODに関する情報をまとめたWikiです。
      <br>
      役職・システム・設定などの情報を掲載していきます。
    </p>
  </section>

</main>

<footer>
  Tora MOD Wiki
</footer>

</body>
</html>
