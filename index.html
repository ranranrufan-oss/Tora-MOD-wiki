
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>トラ-MOD-ウィキ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #0d0e13;
  color: #f2f3f7;
  font-family: Arial, "Noto Sans JP", sans-serif;
}

header {
  padding: 20px;
  border-bottom: 1px solid #30333d;
  font-size: 23px;
  font-weight: bold;
}

main {
  max-width: 750px;
  margin: auto;
  padding: 25px 16px;
}

h1 {
  font-size: 29px;
  margin-bottom: 24px;
}

h2 {
  font-size: 20px;
  margin: 30px 0 15px;
}

.search {
  width: 100%;
  padding: 14px;
  margin-bottom: 22px;
  border: 1px solid #353947;
  border-radius: 12px;
  background: #191c26;
  color: white;
  font-size: 16px;
}

.role {
  background: #1b202d;
  border: 1px solid #303547;
  border-radius: 23px;
  margin-bottom: 20px;
  overflow: hidden;
}

.role-button {
  width: 100%;
  min-height: 137px;
  padding: 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  background: transparent;
  border: none;
  color: white;
  text-align: left;
  cursor: pointer;
}

.role-icon {
  width: 85px;
  height: 85px;
  flex-shrink: 0;
  border-radius: 18px;
  background: #050609;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 42px;
}

.role-info {
  flex: 1;
}

.role-name {
  font-size: 24px;
  font-weight: bold;
  margin-bottom: 7px;
}

.role-en {
  color: #969dac;
  font-size: 18px;
}

.arrow {
  color: #aab0c0;
  font-size: 23px;
  transition: transform .2s;
}

.role.open .arrow {
  transform: rotate(180deg);
}

.description {
  display: none;
  padding: 0 22px 22px;
  color: #c4c9d4;
  line-height: 1.8;
}

.role.open .description {
  display: block;
}

.tag {
  display: inline-block;
  padding: 5px 12px;
  border-radius: 8px;
  background: #292f40;
  color: #b8c6e8;
  font-size: 13px;
  margin-bottom: 12px;
}

footer {
  text-align: center;
  padding: 30px;
  color: #777e8d;
  font-size: 13px;
}
</style>
</head>

<body>

<header>役職Wiki</header>

<main>

<h1>トラ-MOD Wiki</h1>

<input
  class="search"
  id="search"
  type="text"
  placeholder="役職を検索..."
>

<h2>役職一覧</h2>

<div id="role-list"></div>

</main>

<footer>
トラ-MOD Wiki
</footer>

<script>

// 役職データ
// 新しい役職はここに追加！

const roles = [
  {
    name: "シェリフ",
    english: "Sheriff",
    icon: "🏹",
    color: "#5599f5",
    faction: "クルー",
    description: "インポスターなどの敵をキルできる役職。対象を間違えると自分が死亡する。"
  },

  {
    name: "シリアルキラー",
    english: "Serial Killer",
    icon: "🔪",
    color: "#f05260",
    faction: "インポスター",
    description: "プレイヤーをキルして勝利を目指す役職。"
  },

  {
    name: "タイガー",
    english: "Tiger",
    icon: "🐯",
    color: "#ffd400",
    faction: "第三陣営",
    description: "捕食モードを使用して敵を倒す特殊な役職。"
  }
];

// 役職カードを表示
const list = document.getElementById("role-list");

function showRoles(keyword = "") {

  list.innerHTML = "";

  roles
    .filter(role =>
      role.name.toLowerCase().includes(keyword.toLowerCase()) ||
      role.english.toLowerCase().includes(keyword.toLowerCase())
    )
    .forEach(role => {

      const card = document.createElement("div");
      card.className = "role";

      const button = document.createElement("button");
      button.className = "role-button";

      const icon = document.createElement("div");
      icon.className = "role-icon";
      icon.textContent = role.icon;

      const info = document.createElement("div");
      info.className = "role-info";

      const name = document.createElement("div");
      name.className = "role-name";
      name.style.color = role.color;
      name.textContent = role.name;

      const english = document.createElement("div");
      english.className = "role-en";
      english.textContent = "/ " + role.english;

      info.append(name, english);

      const arrow = document.createElement("div");
      arrow.className = "arrow";
      arrow.textContent = "▼";

      button.append(icon, info, arrow);

      const description = document.createElement("div");
      description.className = "description";

      const tag = document.createElement("div");
      tag.className = "tag";
      tag.textContent = role.faction;

      const text = document.createElement("div");
      text.textContent = role.description;

      description.append(tag, text);

      button.addEventListener("click", () => {
        card.classList.toggle("open");
      });

      card.append(button, description);
      list.appendChild(card);
    });
}

document.getElementById("search")
  .addEventListener("input", event => {
    showRoles(event.target.value);
  });

showRoles();

</script>

</body>
</html>
