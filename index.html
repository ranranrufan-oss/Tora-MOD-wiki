<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tora MOD Wiki</title>

<style>
* {
  box-sizing: border-box;
}

:root {
  /* テーマ基本色 */
  --bg: #0d0e13;
  --header: #151720;
  --card: #1b202d;
  --sidebar-bg: #151822;
  --border: #303547;
  --text: #f2f3f7;
  --sub: #9ba2b2;
  --hover: #252c3c;

  /* ★各陣営の文字色 */
  --c-impostor: #ff4d4d; /* インポスター：赤 */
  --c-madmate:  var(--c-impostor); /* マッドメイト：インポスターと同色 */
  --c-crewmate: #38bdf8; /* クルーメイト：青 */
  --c-neutral:  #9ca3af; /* 第三陣営：灰色 */
  --c-modifier: #22c55e; /* 属性：緑 */
  --c-ghost:    #ffffff; /* 幽霊役職：白 */
}

body.light {
  --bg: #f3f4f7;
  --header: #ffffff;
  --card: #ffffff;
  --sidebar-bg: #ffffff;
  --border: #d9dce5;
  --text: #222532;
  --sub: #697080;
  --hover: #edf0f6;
  --c-ghost: #4b5563; /* ライトモード時のみ白は見えなくなるため濃いグレー */
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, "Noto Sans JP", sans-serif;
  transition: background .2s, color .2s;
}

/* ヘッダー */
header {
  min-height: 65px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  background: var(--header);
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  z-index: 50;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* 三本線（ハンバーガー）ボタン */
.menu-button {
  background: transparent;
  border: none;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 5px;
  width: 40px;
  height: 40px;
  padding: 0;
  border-radius: 8px;
}

.menu-button:active {
  background: var(--card);
}

.menu-bar {
  display: block;
  width: 22px;
  height: 2.5px;
  background-color: var(--text);
  border-radius: 2px;
}

.header-title {
  font-size: 20px;
  font-weight: bold;
}

.settings-button {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 10px;
  padding: 8px 14px;
  font-size: 14px;
  cursor: pointer;
  transition: background .2s;
}
.settings-button:hover {
  background: var(--hover);
}

/* サイドメニュー */
.sidebar-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.65);
  backdrop-filter: blur(2px);
  z-index: 200;
}

.sidebar-overlay.show {
  display: block;
}

.sidebar {
  position: fixed;
  top: 0;
  left: -280px;
  width: 280px;
  height: 100%;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--border);
  z-index: 201;
  transition: left 0.25s ease-out;
  padding: 20px;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}

.sidebar.show {
  left: 0;
}

.sidebar-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}

.sidebar-header h3 {
  margin: 0;
  font-size: 18px;
}

.sidebar-close {
  background: none;
  border: none;
  color: var(--sub);
  font-size: 26px;
  cursor: pointer;
  line-height: 1;
}

.menu-section {
  margin-bottom: 22px;
}

.menu-section-title {
  font-size: 12px;
  color: var(--sub);
  font-weight: bold;
  margin-bottom: 8px;
  padding-left: 8px;
}

.menu-link {
  display: block;
  padding: 10px 12px;
  color: var(--text);
  text-decoration: none;
  border-radius: 8px;
  font-size: 15px;
  transition: background .2s;
}

.menu-link:hover {
  background: var(--hover);
}

/* ★サイドバー内の文字色（マッドメイトもインポスター色に統一） */
.menu-link.impostor,
.menu-link.madmate  { color: var(--c-impostor) !important; }
.menu-link.crewmate { color: var(--c-crewmate) !important; }
.menu-link.neutral  { color: var(--c-neutral) !important; }
.menu-link.modifier { color: var(--c-modifier) !important; }
.menu-link.ghost    { color: var(--c-ghost) !important; }

/* メイン */
main {
  max-width: 900px;
  margin: auto;
  padding: 30px 20px;
}

h1 {
  font-size: 34px;
  margin: 0 0 6px 0;
}

.subtitle {
  color: var(--sub);
  font-size: 15px;
}

/* ウェルカムカード */
.welcome {
  margin-top: 28px;
  padding: 24px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
}

.welcome h2 {
  margin-top: 0;
  margin-bottom: 14px;
  font-size: 22px;
}

.welcome p {
  margin: 0;
  color: var(--sub);
  line-height: 1.8;
  font-size: 15px;
}

/* フッター */
footer {
  margin-top: 70px;
  padding: 30px;
  text-align: center;
  color: var(--sub);
  border-top: 1px solid var(--border);
  font-size: 13px;
}

/* 設定モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.6);
  backdrop-filter: blur(2px);
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 300;
}

.modal.show {
  display: flex;
}

.modal-content {
  width: 100%;
  max-width: 400px;
  background: var(--card);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
}

.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.modal-header h2 {
  margin: 0;
  font-size: 20px;
}

.close {
  background: none;
  border: none;
  color: var(--text);
  font-size: 24px;
  cursor: pointer;
  line-height: 1;
}

.setting-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
}

select {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}

/* スマホ対応 */
@media (max-width: 600px) {
  h1 {
    font-size: 28px;
  }
}
</style>
</head>

<body>

<!-- ヘッダー -->
<header>
  <div class="header-left">
    <!-- 三本線ボタン -->
    <button class="menu-button" onclick="toggleSidebar()" aria-label="メニューを開く">
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
      <span class="menu-bar"></span>
    </button>
    <span class="header-title">Tora MOD</span>
  </div>

  <button class="settings-button" onclick="openSettings()">設定</button>
</header>

<!-- サイドバー -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h3>メニュー</h3>
    <button class="sidebar-close" onclick="toggleSidebar()">×</button>
  </div>

  <div class="menu-section">
    <div class="menu-section-title">メイン</div>
    <a href="#" class="menu-link" onclick="toggleSidebar()">トップページ</a>
  </div>

  <div class="menu-section">
    <div class="menu-section-title">役職一覧</div>
    <a href="#" class="menu-link impostor" onclick="toggleSidebar()">インポスター</a>
    <a href="#" class="menu-link madmate"  onclick="toggleSidebar()">マッドメイト</a>
    <a href="#" class="menu-link crewmate" onclick="toggleSidebar()">クルーメイト</a>
    <a href="#" class="menu-link neutral"  onclick="toggleSidebar()">第三陣営</a>
    <a href="#" class="menu-link modifier" onclick="toggleSidebar()">属性</a>
    <a href="#" class="menu-link ghost"    onclick="toggleSidebar()">幽霊役職</a>
  </div>

  <div class="menu-section">
    <div class="menu-section-title">その他</div>
    <a href="#" class="menu-link" onclick="toggleSidebar()">システム設定</a>
  </div>
</nav>

<!-- メインコンテンツ -->
<main>
  <h1>Tora MOD</h1>
  <div class="subtitle">Tora MOD Official Wiki</div>

  <!-- ウェルカム -->
  <section class="welcome">
    <h2>Welcome to Tora MOD Wiki</h2>
    <p>
      Tora MODに関する情報をまとめたWikiです。<br>
      役職・システム・設定などの情報を掲載していきます。
    </p>
  </section>
</main>

<footer>
  Tora MOD Wiki
</footer>

<!-- 設定モーダル -->
<div class="modal" id="settingsModal">
  <div class="modal-content">
    <div class="modal-header">
      <h2>設定</h2>
      <button class="close" onclick="closeSettings()">×</button>
    </div>
    <div class="setting-row">
      <span>テーマ</span>
      <select id="themeSelect" onchange="changeTheme(this.value)">
        <option value="dark">ダークモード</option>
        <option value="light">ライトモード</option>
      </select>
    </div>
  </div>
</div>

<script>
// サイドバー開閉
function toggleSidebar() {
  const sidebar = document.getElementById("sidebar");
  const overlay = document.getElementById("sidebarOverlay");
  sidebar.classList.toggle("show");
  overlay.classList.toggle("show");
}

// テーマ管理
const savedTheme = localStorage.getItem("tora-theme") || "dark";

function applyTheme(theme) {
  document.body.classList.toggle("light", theme === "light");
  document.getElementById("themeSelect").value = theme;
}

function changeTheme(theme) {
  localStorage.setItem("tora-theme", theme);
  applyTheme(theme);
}

// 設定モーダル
function openSettings() {
  document.getElementById("settingsModal").classList.add("show");
}

function closeSettings() {
  document.getElementById("settingsModal").classList.remove("show");
}

applyTheme(savedTheme);

document.getElementById("settingsModal").addEventListener("click", function(event) {
  if (event.target === this) {
    closeSettings();
  }
});
</script>

</body>
</html>
